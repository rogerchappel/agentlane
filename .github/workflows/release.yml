name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Install npm with trusted publishing support
        run: npm install --global npm@11.5.1
      - run: npm ci
      - run: npm run release:check
      - name: Build package tarball
        id: package
        run: |
          npm pack --json > npm-pack.json
          filename="$(node -e "const fs = require('node:fs'); const [pack] = JSON.parse(fs.readFileSync('npm-pack.json', 'utf8')); if (!pack?.filename) process.exit(1); process.stdout.write(pack.filename)")"
          echo "filename=${filename}" >> "$GITHUB_OUTPUT"
      - name: Publish package to npm
        run: npm publish "${{ steps.package.outputs.filename }}" --access public --provenance
      - name: Generate release notes
        run: |
          if ! npm run --silent release:notes --if-present -- . > RELEASE_NOTES.md || [ ! -s RELEASE_NOTES.md ]; then
            echo "## Changes" > RELEASE_NOTES.md
            git log --oneline --max-count=20 >> RELEASE_NOTES.md
          fi
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" --notes-file RELEASE_NOTES.md "${{ steps.package.outputs.filename }}"
